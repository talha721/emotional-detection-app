<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <h1 class="text-center mb-4">Emotion Detector</h1>
      <div class="card p-4 shadow-sm">
        <div class="mb-3">
          <label for="textToAnalyze" class="form-label">Enter text for emotion analysis:</label>
          <textarea class="form-control" id="textToAnalyze" rows="4" placeholder="Type a sentence here..."></textarea>
        </div>
        <button onclick="RunSentimentAnalysis()" class="btn btn-primary">Run Analysis</button>
      </div>
      <div class="mt-4">
        <h4>System Response:</h4>
        <div id="system_response" class="alert alert-info" role="alert">Submit text above to see results.</div>
      </div>
    </div>
  </body>
</html>
